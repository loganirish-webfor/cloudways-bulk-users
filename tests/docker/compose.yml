services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: sandbox-root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 40
  runner:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_ROOT_PASSWORD: sandbox-root
      WP_ENVIRONMENT_TYPE: local
      WP_CLI_CACHE_DIR: /tmp/wpcache
    volumes:
      - ../..:/work
      - fixtures:/fixtures
    working_dir: /work
volumes:
  fixtures:
